<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- SixLabs mark, traced from the 33px app icon: a rounded pointy-top hexagon split into three
       blades by three slits (one on the left sloping down into the centre, two on the right that mirror
       each other), around a round opening with a navy core. -->
  <defs>
    <mask id="cuts" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <circle cx="50" cy="50" r="19.5" fill="#000"/>
      <g stroke="#000" stroke-width="4.5">
        <line x1="50" y1="56" x2="0" y2="36.6"/>
        <line x1="43.4" y1="36.7" x2="85" y2="5.5"/>
        <line x1="43.4" y1="63.3" x2="85" y2="94.5"/>
      </g>
    </mask>
  </defs>
  <polygon points="50,11.8 83.1,30.9 83.1,69.1 50,88.2 16.9,69.1 16.9,30.9" fill="#1770ef" stroke="#1770ef" stroke-width="11.6" stroke-linejoin="round" mask="url(#cuts)"/>
  <circle cx="50" cy="50" r="12" fill="#030d2d"/>
</svg>
